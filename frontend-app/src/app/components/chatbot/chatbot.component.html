<!-- src/app/chatbot/chatbot.component.html -->

<!-- Botón flotante -->
<div class="chat-fab" (click)="toggleChat()" [class.open]="estaAbierto">
  <span class="chat-fab-icon">
    <svg *ngIf="!estaAbierto" xmlns="http://www.w3.org/2000/svg"
         width="24" height="24" viewBox="0 0 24 24"
         fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
    </svg>
    <svg *ngIf="estaAbierto" xmlns="http://www.w3.org/2000/svg"
         width="24" height="24" viewBox="0 0 24 24"
         fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="18" y1="6" x2="6" y2="18"/>
      <line x1="6" y1="6" x2="18" y2="18"/>
    </svg>
  </span>
  <span class="chat-badge" *ngIf="!estaAbierto">?</span>
</div>

<!-- Ventana del chat -->
<div class="chat-window" [class.visible]="estaAbierto">

  <!-- Header -->
  <div class="chat-header">
    <div class="chat-header-info">
      <div class="chat-avatar">A</div>
      <div>
        <div class="chat-title">Asistente ASEFIDE</div>
        <div class="chat-subtitle">
          <span class="status-dot"></span>
          {{ isAdmin ? 'Modo Administrador' : 'Modo Asociado' }}
        </div>
      </div>
    </div>
    <div class="chat-header-actions">
      <button class="icon-btn" (click)="limpiarChat()" title="Limpiar chat">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
             viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="1 4 1 10 7 10"/>
          <path d="M3.51 15a9 9 0 1 0 .49-3.51"/>
        </svg>
      </button>
      <button class="icon-btn" (click)="closeChat()" title="Cerrar">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
             viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Mensajes -->
  <div class="chat-messages" #messagesContainer>

    <!-- Sugerencias rápidas (solo si hay 1 mensaje = bienvenida) -->
    <div class="chat-suggestions" *ngIf="mensajes.length === 1">
      <p class="suggestions-label">Preguntas frecuentes:</p>
      <button
        class="suggestion-chip"
        *ngFor="let s of obtenerSugerenciasRapidas"
        (click)="useSuggestion(s)">
        {{ s }}
      </button>
    </div>

    <!-- Lista de mensajes -->
    <div
      *ngFor="let msg of mensajes"
      class="message-wrapper"
      [class.user]="msg.rol === 'user'"
      [class.assistant]="msg.rol === 'assistant'"
      [class.error]="msg.rol === 'error'">

      <!-- Avatar del asistente -->
      <div class="msg-avatar" *ngIf="msg.rol !== 'user'">A</div>

      <!-- Burbuja -->
      <div class="message-bubble">
        <!-- Loading skeleton -->
        <div class="loading-dots" *ngIf="msg.loading">
          <span></span><span></span><span></span>
        </div>
        <!-- Contenido -->
        <div class="msg-content" *ngIf="!msg.loading"
             [innerHTML]="msg.contenido | chatFormat">
        </div>
        <!-- Timestamp -->
        <div class="msg-time" *ngIf="!msg.loading">
          {{ formatTime(msg.timestamp) }}
        </div>
      </div>

    </div>
  </div>

  <!-- Input -->
  <div class="chat-input-area">
    <textarea
      #inputField
      class="chat-input"
      [(ngModel)]="usuarioMensaje"
      (keydown)="onKeyDown($event)"
      placeholder="Escribe tu pregunta..."
      rows="1"
      [disabled]="estaCargando">
    </textarea>
    <button
      class="send-btn"
      (click)="enviarMensaje()"
      [disabled]="!usuarioMensaje.trim() || estaCargando">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"
           viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"/>
        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>

</div>
